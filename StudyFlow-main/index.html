<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyFlow — Login</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/animacoes.css" />
    <link rel="stylesheet" href="css/celular.css" />
  </head>
  <body>
    <div class="faixa-municipio" aria-hidden="true"></div>
    <main class="login">
      <div class="login__logo" aria-hidden="true">
        <!-- Capelo de formatura (ícone do StudyFlow) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z" />
          <path d="M22 10v6" />
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </svg>
      </div>

      <h1 class="login__titulo">Faça Login</h1>

      <section class="login__card">
        <form id="form-login" class="login__form" novalidate>
          <label class="sr-only" for="matricula">Matrícula</label>
          <input
            id="matricula"
            class="campo"
            type="text"
            name="matricula"
            placeholder="Matrícula"
            autocomplete="username"
            autocapitalize="off"
            spellcheck="false"
            autofocus
          />

          <label class="sr-only" for="senha">Senha</label>
          <input
            id="senha"
            class="campo"
            type="password"
            name="senha"
            placeholder="Senha"
            autocomplete="current-password"
          />

          <button id="esqueceu" class="login__esqueceu" type="button">Esqueceu a senha?</button>

          <p id="mensagem" class="login__mensagem" role="alert" hidden></p>

          <button id="botao-login" class="login__botao" type="submit">Login</button>
        </form>
      </section>

      <footer class="prefeitura-login">
        <img src="assets/brasao.webp" alt="Brasão de Santa Rosa do Sul" width="48" height="75" />
        <div>
          <span>Prefeitura Municipal de</span>
          <strong>Santa Rosa do Sul</strong>
        </div>
      </footer>

      <nav class="login__legal" aria-label="Documentos">
        <a href="termos.html">Termos de Uso</a>
        <span aria-hidden="true">·</span>
        <a href="privacidade.html">Privacidade</a>
      </nav>
    </main>

    <script src="data/contas.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
