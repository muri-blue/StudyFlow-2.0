<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyFlow — Conquistas</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/mascote.css" />
    <link rel="stylesheet" href="css/loja.css" />
    <link rel="stylesheet" href="css/conquistas.css" />
    <link rel="stylesheet" href="css/animacoes.css" />
    <link rel="stylesheet" href="css/celular.css" />
  </head>
  <body>
    <div class="app">
      <aside id="sidebar" class="sidebar"></aside>

      <main class="principal">
        <header class="pagina__topo">
          <div>
            <a class="voltar" href="mascote.html"><span data-icone="chevronLeft" data-tamanho="16"></span>Mascote</a>
            <h1 class="pagina__titulo">Conquistas</h1>
            <p id="resumo" class="pagina__subtitulo"></p>
          </div>
          <span class="saldo"><span data-icone="coins" data-tamanho="18"></span><span id="saldo">0</span> moedas</span>
        </header>

        <section class="cartao progresso-geral" aria-label="Progresso geral">
          <div class="progresso-geral__texto">
            <strong id="geral-numero">0/0</strong>
            <span>conquistas desbloqueadas</span>
          </div>
          <div class="barra__trilho barra__trilho--grande"><div id="geral-barra" class="barra__preenchido barra__preenchido--sabedoria"></div></div>
          <button id="btn-resgatar-todas" type="button" class="botao-primario" hidden>
            <span data-icone="gift" data-tamanho="16"></span><span id="resgatar-todas-texto">Resgatar todas</span>
          </button>
        </section>

        <div class="segmentado segmentado--conquistas" role="group" aria-label="Mostrar">
          <button type="button" class="segmentado__opcao ativo" data-filtro="todas" aria-pressed="true">Todas</button>
          <button type="button" class="segmentado__opcao" data-filtro="desbloqueadas" aria-pressed="false">Desbloqueadas</button>
          <button type="button" class="segmentado__opcao" data-filtro="andamento" aria-pressed="false">Em andamento</button>
        </div>

        <ul id="lista" class="lista-conquistas"></ul>
      </main>

      <aside class="lateral">
        <section class="cartao painel" aria-labelledby="proxima-titulo">
          <h2 id="proxima-titulo" class="painel__titulo">Quase lá!</h2>
          <div id="proxima"></div>
        </section>
        <section class="cartao painel" aria-labelledby="dica-titulo">
          <h2 id="dica-titulo" class="painel__titulo">Como funciona</h2>
          <ul class="dicas">
            <li>As conquistas são desbloqueadas sozinhas, conforme você usa o StudyFlow.</li>
            <li>Cada uma dá moedas: toque em <strong>Resgatar</strong> para recebê-las.</li>
            <li>Use as moedas na <a href="loja.html">Loja da Idebinha</a>.</li>
          </ul>
        </section>
      </aside>
    </div>

    <div id="confete" class="confete" aria-hidden="true"></div>

    <script src="js/auth.js"></script>
    <script src="js/icones.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/idebinha.js"></script>
    <script src="js/conquistas.js"></script>
    <script src="js/lembretes.js"></script>
    <script src="js/aceite.js"></script>
    <script src="js/conquistas-tela.js"></script>
  </body>
</html>
